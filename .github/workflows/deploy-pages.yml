name: Deploy domain viewer to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "viewer/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build content manifest for this deployment
        run: node viewer/scripts/build-manifest.mjs
      - name: Validate viewer content
        run: node --test tests/viewer-content-schema.test.mjs tests/viewer-baseline.test.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload viewer
        uses: actions/upload-pages-artifact@v3
        with:
          path: viewer
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4

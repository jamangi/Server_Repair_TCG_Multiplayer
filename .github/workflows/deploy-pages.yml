name: Deploy Server Repair Viewer to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "viewer/**"
      - "src/engine/**"
      - "src/builder/**"
      - "src/shared/**"
      - "content/gameplay-v1/**"
      - "assets/**"
      - "docs/audio/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tests/task-010-browser-portability.test.mjs"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build content manifest for this deployment
        run: node viewer/scripts/build-manifest.mjs
      - name: Reject stale or unexpected committed Play assets
        run: node viewer/scripts/verify-play-assets.mjs
      - name: Build browser-safe Play runtime
        run: node viewer/scripts/build-play-assets.mjs
      - name: Build browser-safe SFX runtime catalog
        run: node viewer/scripts/build-sfx-assets.mjs
      - name: Verify Play runtime allowlist, integrity, and committed freshness
        run: |
          node viewer/scripts/verify-play-assets.mjs
          git diff --exit-code -- viewer/generated/play
          node viewer/scripts/verify-sfx-assets.mjs
          git diff --exit-code -- viewer/generated/sfx
      - name: Validate viewer content
        run: node --test tests/viewer-content-schema.test.mjs tests/viewer-baseline.test.mjs tests/task-010-browser-portability.test.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload viewer
        uses: actions/upload-pages-artifact@v3
        with:
          path: viewer
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4

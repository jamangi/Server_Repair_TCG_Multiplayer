name: Rebuild content manifest
on:
  push:
    branches: ["main"]
    paths: ["viewer/content/**", "viewer/scripts/build-manifest.mjs"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  manifest:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build manifest
        run: node viewer/scripts/build-manifest.mjs
      - name: Validate viewer content
        run: node --test tests/viewer-content-schema.test.mjs tests/viewer-baseline.test.mjs
      - name: Commit manifest if changed
        run: |
          if git diff --quiet -- viewer/content/manifest.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add viewer/content/manifest.json
          git commit -m "chore: rebuild content manifest"
          git push

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Room lobby wireframe</title><desc id="desc">A social pre-match room showing player seats, readiness, settings, chat, and host controls.</desc>
  <defs><style>.bg{fill:#edf2f7}.panel{fill:#fff;stroke:#8ba0b5;stroke-width:2}.dark{fill:#18324a}.soft{fill:#dbe8f2}.accent{fill:#efb34f}.co{fill:#61b5a9}.txt{font-family:Arial,sans-serif;fill:#18324a}.inv{font-family:Arial,sans-serif;fill:#fff}.h{font-size:28px;font-weight:700}.m{font-size:18px;font-weight:700}.s{font-size:14px}.dash{fill:none;stroke:#8ba0b5;stroke-width:2;stroke-dasharray:8 7}</style></defs>
  <rect class="bg" width="1200" height="750"/><rect class="dark" x="24" y="20" width="1152" height="66" rx="16"/><text class="inv h" x="48" y="61">Room: Midnight Maintenance</text><text class="inv s" x="940" y="58">6 / 8 seats</text>
  <rect class="panel" x="24" y="104" width="820" height="414" rx="20"/><text class="txt m" x="50" y="140">Presence stage</text>
  <rect class="soft" x="54" y="164" width="360" height="316" rx="18"/><rect class="co" x="54" y="164" width="360" height="44" rx="18"/><text class="inv m" x="72" y="193">TEAM A · CO-OP</text>
  <g class="txt s"><circle class="panel" cx="132" cy="274" r="48"/><text x="99" y="342">Alex · READY</text><circle class="panel" cx="328" cy="274" r="48"/><text x="286" y="342">Mina · READY</text><circle class="dash" cx="132" cy="408" r="48"/><text x="99" y="468">Open seat</text><circle class="dash" cx="328" cy="408" r="48"/><text x="295" y="468">CPU 1</text></g>
  <rect class="soft" x="432" y="164" width="382" height="316" rx="18"/><rect class="accent" x="432" y="164" width="382" height="44" rx="18"/><text class="txt m" x="450" y="193">TEAM B · COMPETITIVE</text>
  <g class="txt s"><circle class="panel" cx="514" cy="274" r="48"/><text x="476" y="342">Jordan · HOST</text><circle class="panel" cx="704" cy="274" r="48"/><text x="670" y="342">Rae · READY</text><circle class="dash" cx="514" cy="408" r="48"/><text x="481" y="468">Open seat</text><circle class="dash" cx="704" cy="408" r="48"/><text x="671" y="468">Open seat</text></g>
  <rect class="panel" x="862" y="104" width="314" height="414" rx="20"/><text class="txt m" x="888" y="142">Match summary</text><g class="txt s"><text x="888" y="184">Mode</text><text x="1080" y="184">Co-op</text><text x="888" y="222">Goal score (X)</text><text x="1080" y="222">10</text><text x="888" y="260">Starting tickets (S)</text><text x="1080" y="260">3</text><text x="888" y="298">Queue minimum (Q)</text><text x="1080" y="298">1</text><text x="888" y="336">Turn timer</text><text x="1080" y="336">Off</text></g><rect class="soft" x="886" y="366" width="266" height="54" rx="12"/><text class="txt m" x="940" y="400">Advanced settings</text><rect class="accent" x="886" y="438" width="266" height="56" rx="14"/><text class="txt m" x="978" y="473">READY</text>
  <rect class="panel" x="24" y="538" width="820" height="186" rx="18"/><text class="txt m" x="48" y="574">Room chat</text><text class="txt s" x="48" y="604">ALL</text><text class="txt s" x="102" y="604">TEAM</text><text class="txt s" x="168" y="604">SYSTEM</text><rect class="soft" x="46" y="624" width="774" height="70" rx="12"/><text class="txt s" x="64" y="654">Mina: Ready when you are.</text><text class="txt s" x="64" y="678">System: Jordan changed the starting tickets to 3.</text>
  <rect class="panel" x="862" y="538" width="314" height="186" rx="18"/><text class="txt m" x="888" y="574">Host controls</text><rect class="soft" x="888" y="596" width="118" height="46" rx="12"/><text class="txt s" x="914" y="625">Add CPU</text><rect class="soft" x="1020" y="596" width="132" height="46" rx="12"/><text class="txt s" x="1044" y="625">Manage seat</text><rect class="dark" x="888" y="656" width="264" height="46" rx="12"/><text class="inv s" x="977" y="685">START MATCH</text>
</svg>

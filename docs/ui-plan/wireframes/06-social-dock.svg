<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Persistent social dock wireframe</title><desc id="desc">An application shell with footer navigation, friends status, direct messages, guild chat, and room invites.</desc>
  <defs><style>.bg{fill:#edf2f6}.panel{fill:#fff;stroke:#8ea1b3;stroke-width:2}.dark{fill:#17344c}.soft{fill:#dce8f1}.accent{fill:#efb451}.online{fill:#56b98d}.txt{font-family:Arial,sans-serif;fill:#17344c}.inv{font-family:Arial,sans-serif;fill:#fff}.h{font-size:28px;font-weight:700}.m{font-size:18px;font-weight:700}.s{font-size:14px}</style></defs>
  <rect class="bg" width="1200" height="750"/><rect class="panel" x="24" y="20" width="1152" height="618" rx="20"/><text class="txt h" x="56" y="66">Current application view</text><rect class="soft" x="56" y="98" width="756" height="490" rx="18"/><text class="txt m" x="316" y="330">ROOM BROWSER / LOBBY / GAME</text>
  <rect class="dark" x="24" y="650" width="1152" height="76" rx="16"/><g class="inv s"><text x="58" y="695">HOME</text><text x="142" y="695">ROOMS</text><text x="244" y="695">MY INFO</text><text x="348" y="695">STORE</text><text x="960" y="695">FRIENDS</text><text x="1050" y="695">MESSAGES</text></g><circle class="online" cx="944" cy="689" r="7"/>
  <rect class="panel" x="836" y="88" width="316" height="530" rx="18"/><text class="txt h" x="860" y="130">Social</text><rect class="soft" x="858" y="150" width="272" height="44" rx="12"/><g class="txt s"><text x="876" y="178">FRIENDS</text><text x="964" y="178">WHISPER</text><text x="1050" y="178">GUILD</text></g>
  <g class="txt"><circle class="online" cx="884" cy="230" r="8"/><text class="m" x="904" y="236">Mina</text><text class="s" x="1030" y="236">In lobby</text><circle class="online" cx="884" cy="282" r="8"/><text class="m" x="904" y="288">Jordan</text><text class="s" x="1030" y="288">Online</text><circle fill="#9aa6b2" cx="884" cy="334" r="8"/><text class="m" x="904" y="340">Rae</text><text class="s" x="1030" y="340">Offline</text></g>
  <rect class="soft" x="858" y="374" width="272" height="134" rx="14"/><text class="txt s" x="874" y="404">Mina</text><text class="txt s" x="874" y="434">Want to diagnose the boot ticket?</text><text class="txt s" x="874" y="466">You</text><text class="txt s" x="874" y="490">Send me the room invite.</text><rect class="accent" x="858" y="524" width="130" height="48" rx="12"/><text class="txt s" x="888" y="554">INVITE</text><rect class="dark" x="1000" y="524" width="130" height="48" rx="12"/><text class="inv s" x="1030" y="554">MESSAGE</text>
</svg>

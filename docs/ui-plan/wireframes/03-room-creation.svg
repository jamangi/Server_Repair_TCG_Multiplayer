  <rect x="900" y="158" width="210" height="180" rx="18" fill="#f0f3f6" stroke="#9babbc" stroke-dasharray="8 7"/><text x="952" y="236" fill="#63758a" font-family="Arial" font-size="42">＋</text><text x="945" y="282" fill="#233a51" font-family="Arial" font-size="22" font-weight="700">CUSTOM</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Room creation wireframe</title><desc id="desc">An illustrated, approachable room creation screen with basic settings and advanced options hidden behind disclosure.</desc>

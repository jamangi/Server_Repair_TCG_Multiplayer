  <g font-family="Arial"><rect x="80" y="158" width="250" height="180" rx="18" fill="#20364a" stroke="#ffb84d" stroke-width="5"/><circle cx="205" cy="218" r="38" fill="#ffb84d"/><path d="M185 220h40M205 200v40" stroke="#172435" stroke-width="8"/><text x="128" y="288" fill="white" font-size="26" font-weight="700">STANDARD SHIFT</text><text x="116" y="316" fill="#a9bdd1" font-size="14">Balanced preset · Selected</text>

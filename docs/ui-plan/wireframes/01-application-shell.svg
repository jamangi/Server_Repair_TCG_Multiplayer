<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Server Repair TCG application shell wireframe</title>
  <desc id="desc">A persistent game application shell with identity, main stage, footer navigation, and a social drawer.</desc>
  <rect width="1200" height="750" fill="#e8eef5"/>
  <rect x="30" y="25" width="1140" height="700" rx="28" fill="#f9fbfd" stroke="#63758a" stroke-width="3"/>
  <rect x="30" y="25" width="1140" height="86" rx="28" fill="#172435"/>
  <text x="65" y="62" fill="#70c7ff" font-family="Arial" font-size="16" font-weight="700">SERVER REPAIR</text>
  <text x="65" y="88" fill="white" font-family="Arial" font-size="28" font-weight="700">OPERATIONS DECK</text>
  <g fill="#dbe7f3" font-family="Arial" font-size="17" font-weight="700">
    <text x="400" y="75">ROOMS</text><text x="500" y="75">MY INFO</text><text x="620" y="75">STORE</text>
  </g>
  <circle cx="1035" cy="68" r="24" fill="#70c7ff"/><text x="1024" y="76" fill="#172435" font-family="Arial" font-size="20">JT</text>
  <text x="1070" y="63" fill="white" font-family="Arial" font-size="15" font-weight="700">Jules</text><text x="1070" y="84" fill="#a9bfd4" font-family="Arial" font-size="13">ONLINE</text>
  <rect x="58" y="137" width="820" height="495" rx="22" fill="#ffffff" stroke="#9babbc" stroke-width="2"/>
  <text x="90" y="182" fill="#233a51" font-family="Arial" font-size="14" font-weight="700">CURRENT DESTINATION</text>
  <text x="90" y="225" fill="#172435" font-family="Arial" font-size="36" font-weight="700">Primary application stage</text>
  <rect x="90" y="255" width="755" height="335" rx="18" fill="#edf3f8" stroke="#b7c4d1" stroke-dasharray="10 8"/>
  <text x="337" y="425" fill="#63758a" font-family="Arial" font-size="22">Room browser, lobby, match, profile, or store</text>
  <rect x="900" y="137" width="245" height="495" rx="22" fill="#1e3043"/>
  <text x="928" y="178" fill="white" font-family="Arial" font-size="22" font-weight="700">Social</text>
  <g font-family="Arial" font-size="13" font-weight="700"><text x="928" y="214" fill="#70c7ff">FRIENDS</text><text x="1002" y="214" fill="#9eb2c6">MESSAGES</text><text x="1085" y="214" fill="#9eb2c6">GUILD</text></g>
  <g fill="#2b4258" stroke="#5d7892"><rect x="922" y="238" width="200" height="62" rx="12"/><rect x="922" y="314" width="200" height="62" rx="12"/><rect x="922" y="390" width="200" height="62" rx="12"/></g>
  <g fill="#76e3ad"><circle cx="946" cy="269" r="7"/><circle cx="946" cy="345" r="7"/></g><circle cx="946" cy="421" r="7" fill="#75879a"/>
  <g fill="white" font-family="Arial" font-size="15"><text x="966" y="274">Morgan — In room</text><text x="966" y="350">Ari — Available</text><text x="966" y="426">Lee — Offline</text></g>
  <rect x="30" y="650" width="1140" height="75" rx="0 0 28 28" fill="#26394c"/>
  <g font-family="Arial" font-size="15" font-weight="700" fill="#eaf2f9"><text x="90" y="695">⌂  HOME</text><text x="240" y="695">▦  ROOMS</text><text x="400" y="695">♙  MY INFO</text><text x="570" y="695">▣  STORE</text><text x="900" y="695">●  FRIENDS  2</text><text x="1045" y="695">✉  MSG  1</text></g>
</svg>

name: Rebuild content manifest
on:
  push:
    branches: ["main"]
    paths: ["content/**", "scripts/build-manifest.mjs"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  manifest:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build manifest
        run: node scripts/build-manifest.mjs
      - name: Commit manifest if changed
        run: |
          if git diff --quiet -- content/manifest.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/manifest.json
          git commit -m "chore: rebuild content manifest"
          git push
